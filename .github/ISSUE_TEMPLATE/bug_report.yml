name: "🐛 Bug report"
description: Report a problem with Archipelago Notifier.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting this issue. Never share Discord tokens or Archipelago passwords."
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened?
      placeholder: Describe the issue you encountered.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run /add_room...\n2. ...\n3. Observe the error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Redact tokens, passwords, and other sensitive information.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: hosting
    attributes:
      label: Environment
      options:
        - Public bot
        - Self-hosted instance
        - Other
    validations:
      required: true
