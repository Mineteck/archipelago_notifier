name: "💡 Feature request"
description: Suggest an improvement or new feature.
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Archipelago Notifier!"
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this improvement solve?
      placeholder: Currently, it is difficult to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement
      placeholder: I would like the bot to...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      placeholder: Have you considered other solutions?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      placeholder: Examples, screenshots, or useful links.
    validations:
      required: false
