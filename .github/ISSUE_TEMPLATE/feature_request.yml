name: "💡 Feature request"
description: Proposer une amélioration ou une nouvelle fonctionnalité.
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Merci de contribuer à l'amélioration d'Archipelago Notifier !"
  - type: textarea
    id: problem
    attributes:
      label: Besoin ou problème rencontré
      description: Quel besoin cette amélioration permettrait-elle de couvrir ?
      placeholder: Actuellement, il est difficile de...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Amélioration proposée
      placeholder: J'aimerais que le bot puisse...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées (facultatif)
      placeholder: Avez-vous envisagé d'autres solutions ?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Informations complémentaires (facultatif)
      placeholder: Exemples, captures d'écran ou liens utiles.
    validations:
      required: false
